<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malena Foyo Site</title>
    <link rel="stylesheet" type="text/css" href="INDIVIDUALITEMS.css">
    <link href="https://fonts.googleapis.com/css2?family=Ballet:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
</head>
<body>
    <div id="nav">
        <p id="place">CDMX</p>
        <p id="name">MALENA FOYO</p>
        <p id="year">2025</p>
    </div>
    <div class="background-text">Golden Dreams</div>
    <div class="star1">★</div> 
    <a href="index.html">
    <div class="back">Back</div> 
    </a>
    <div class="container">
        <main class="main-content">
            <div class="product-section">
                <div class="product-image photodiv">
                    <img src="LOOKBOOKPICTURES/GOLD TUBE DRESS/GOLDTUBETHUMB.JPG" alt="Gold Tube Dress" class="dress-image">
                </div>
                
                <div class="product-details">
                    <div class="product-info photodiv">
                        <p class="product-name">TUBE DRESS</p>
                        <p class="product-material">Polyester</p>
                        <p class="product-origin">Made in CDMX</p>
                    </div>
                    
                    <div class="color-selector photodiv">
                        <span class="color-label">Color: Gold</span>
                        <button class="color-arrow" aria-label="View more colors">></button>
                    </div>
                    
                    <div class="action-buttons photodiv">
                        <button class="cart-btn">
                            CART
                            <span class="cart-plus">+</span>
                        </button>
                        <button class="checkout-btn">CHECKOUT</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Bouncing Stars Script with Hover Effects
        const stars = [];
        const kRestitution = 0.98;
        let navHeight = 0;

        function setup() {
          // Get the nav element height
          const navElement = document.getElementById('nav');
          navHeight = navElement ? navElement.offsetHeight : 50; // fallback to 50px
          
          // Create canvas that covers the full window
          createCanvas(windowWidth, windowHeight);
          
          // Position canvas behind other elements
          const canvas = document.querySelector('canvas');
          canvas.style.position = 'fixed';
          canvas.style.top = '0';
          canvas.style.left = '0';
          canvas.style.zIndex = '-1'; // Behind content but above background
          canvas.style.pointerEvents = 'none'; // Don't block mouse events to content below
          canvas.style.cursor = 'default'; // Set default cursor
          
          initStars();
          createModal();
        }

        function initStars() {
          stars.length = 0;
          
          for (let i = 0; i < 3; i++) {
            const star = {
              position: { 
                x: random(50, width - 50), 
                y: random(navHeight + 50, height - 50) 
              },
              velocity: { 
                x: random(-8, 8), 
                y: random(-8, 8) 
              },
              size: 30,
              baseSize: 30, // Store original size
              targetSize: 30, // Target size for smooth transitions
              color: 'white',
              borderColor: 'rgb(231, 74, 231)',
              rotation: 0,
              rotationSpeed: random(-0.1, 0.1),
              isHovered: false,
              frozenVelocity: { x: 0, y: 0 } // Store velocity when frozen
            };
            
            // Ensure minimum velocity
            if (abs(star.velocity.x) < 2) star.velocity.x = star.velocity.x > 0 ? 2 : -2;
            if (abs(star.velocity.y) < 2) star.velocity.y = star.velocity.y > 0 ? 2 : -2;
            
            stars.push(star);
          }
        }

        function draw() {
          clear(); // Clear the canvas to keep background visible
          
          // Update nav height in case of window resize
          const navElement = document.getElementById('nav');
          navHeight = navElement ? navElement.offsetHeight : 50;
          
          // Check for hover on each star
          checkHover();
          
          for (const star of stars) {
            updateStarSize(star);
            if (!star.isHovered) {
              stepStar(star);
            }
            drawStar(star);
          }
        }

        function checkHover() {
          let anyStarHovered = false;
          const mousePos = { x: mouseX, y: mouseY };
          
          for (const star of stars) {
            const distance = dist(mousePos.x, mousePos.y, star.position.x, star.position.y);
            const wasHovered = star.isHovered;
            
            // Check if mouse is within star radius
            star.isHovered = distance < star.size / 2;
            
            if (star.isHovered) {
              anyStarHovered = true;
            }
            
            // If just started hovering, freeze the star
            if (star.isHovered && !wasHovered) {
              star.frozenVelocity.x = star.velocity.x;
              star.frozenVelocity.y = star.velocity.y;
              star.velocity.x = 0;
              star.velocity.y = 0;
              star.targetSize = star.baseSize * 1.3; // Grow by 30%
            }
            
            // If just stopped hovering, restore movement
            if (!star.isHovered && wasHovered) {
              star.velocity.x = star.frozenVelocity.x;
              star.velocity.y = star.frozenVelocity.y;
              star.targetSize = star.baseSize; // Return to original size
            }
          }
          
          // Update cursor style based on hover state
          if (anyStarHovered) {
            document.body.style.cursor = 'pointer';
          } else {
            document.body.style.cursor = 'default';
          }
        }

        function updateStarSize(star) {
          // Smooth size transition
          const sizeDiff = star.targetSize - star.size;
          star.size += sizeDiff * 0.15; // Smooth easing
        }

        function stepStar(star) {
          // Apply velocity to position
          star.position.x += star.velocity.x;
          star.position.y += star.velocity.y;
          
          // Update rotation
          star.rotation += star.rotationSpeed;
          
          // Collision detection with walls
          const radius = star.size / 2;
          
          // Left wall
          if (star.position.x - radius < 0) {
            star.velocity.x = abs(star.velocity.x) * kRestitution;
            star.position.x = radius;
          }
          
          // Right wall
          if (star.position.x + radius > width) {
            star.velocity.x = -abs(star.velocity.x) * kRestitution;
            star.position.x = width - radius;
          }
          
          // Top wall (nav div)
          if (star.position.y - radius < navHeight) {
            star.velocity.y = abs(star.velocity.y) * kRestitution;
            star.position.y = navHeight + radius;
          }
          
          // Bottom wall
          if (star.position.y + radius > height) {
            star.velocity.y = -abs(star.velocity.y) * kRestitution;
            star.position.y = height - radius;
          }
          
          // Collision detection with photodivs (only when not hovered)
          if (!star.isHovered) {
            checkPhotoCollisions(star, radius);
          }
        }

        function checkPhotoCollisions(star, radius) {
          const photodivs = document.querySelectorAll('.photodiv');
          
          photodivs.forEach(photodiv => {
            const rect = photodiv.getBoundingClientRect();
            
            // Get photodiv boundaries
            const left = rect.left;
            const right = rect.right;
            const top = rect.top;
            const bottom = rect.bottom;
            
            // Check if star is colliding with this photodiv
            const starLeft = star.position.x - radius;
            const starRight = star.position.x + radius;
            const starTop = star.position.y - radius;
            const starBottom = star.position.y + radius;
            
            // Check for overlap
            if (starRight > left && starLeft < right && starBottom > top && starTop < bottom) {
              // Calculate overlap distances
              const overlapLeft = starRight - left;
              const overlapRight = right - starLeft;
              const overlapTop = starBottom - top;
              const overlapBottom = bottom - starTop;
              
              // Find the smallest overlap (closest edge)
              const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
              
              if (minOverlap === overlapLeft) {
                // Hit left edge of photodiv
                star.velocity.x = -abs(star.velocity.x) * kRestitution;
                star.position.x = left - radius;
              } else if (minOverlap === overlapRight) {
                // Hit right edge of photodiv
                star.velocity.x = abs(star.velocity.x) * kRestitution;
                star.position.x = right + radius;
              } else if (minOverlap === overlapTop) {
                // Hit top edge of photodiv
                star.velocity.y = -abs(star.velocity.y) * kRestitution;
                star.position.y = top - radius;
              } else if (minOverlap === overlapBottom) {
                // Hit bottom edge of photodiv
                star.velocity.y = abs(star.velocity.y) * kRestitution;
                star.position.y = bottom + radius;
              }
            }
          });
        }

        function drawStar(star) {
          push();
          translate(star.position.x, star.position.y);
          rotate(star.rotation);
          
          // Draw star with border and rounded tips
          const outerRadius = star.size / 2;
          const innerRadius = outerRadius * 0.4;
          
          // Draw border (thicker)
          fill(star.borderColor);
          noStroke();
          drawRoundedStar(outerRadius + 6, innerRadius + 5);
          
          // Draw main star (white)
          fill(star.color);
          noStroke();
          drawRoundedStar(outerRadius, innerRadius);
          
          pop();
        }

        function drawRoundedStar(outerRadius, innerRadius) {
          const points = [];
          
          // Calculate all star points
          for (let i = 0; i < 10; i++) {
            const angle = (i * PI) / 5;
            const radius = i % 2 === 0 ? outerRadius : innerRadius;
            points.push({
              x: cos(angle) * radius,
              y: sin(angle) * radius
            });
          }
          
          beginShape();
          for (let i = 0; i < points.length; i++) {
            const current = points[i];
            const next = points[(i + 1) % points.length];
            const prev = points[(i - 1 + points.length) % points.length];
            
            if (i % 2 === 0) { // Outer points - make them rounded
              // Calculate vectors to adjacent points
              const toPrev = createVector(prev.x - current.x, prev.y - current.y);
              const toNext = createVector(next.x - current.x, next.y - current.y);
              
              // Normalize and scale for rounding
              toPrev.normalize().mult(3);
              toNext.normalize().mult(3);
              
              // Create control points for curves
              const cp1 = { x: current.x + toPrev.x, y: current.y + toPrev.y };
              const cp2 = { x: current.x + toNext.x, y: current.y + toNext.y };
              
              if (i === 0) {
                vertex(cp1.x, cp1.y);
              }
              quadraticVertex(current.x, current.y, cp2.x, cp2.y);
            } else { // Inner points - keep sharp
              vertex(current.x, current.y);
            }
          }
          endShape(CLOSE);
        }

        function mousePressed() {
          // Check if clicking on a star
          for (const star of stars) {
            const distance = dist(mouseX, mouseY, star.position.x, star.position.y);
            if (distance < star.size / 2) {
              showModal();
              return; // Exit after first star clicked
            }
          }
        }

        function createModal() {
          // Create modal overlay
          const modal = document.createElement('div');
          modal.id = 'star-modal';
          modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            display: none;
            justify-content: flex-start;
            align-items: center;
            padding-left: 20px;
            box-sizing: border-box;
          `;
          
          // Create content container
          const content = document.createElement('div');
          content.style.cssText = `
            background: white;
            padding: 0px;
            max-width: 900px;
            width: 100%;
            position: relative;
            color: #BD9B46;
            font-size: 18pt;
          `;
          
          // Create close button
          const closeBtn = document.createElement('button');
          closeBtn.innerHTML = '×';
          closeBtn.style.cssText = `
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #BD9B46;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
          `;
          closeBtn.onclick = hideModal;
          
          // Create navigation tabs
          const nav = document.createElement('div');
          nav.style.cssText = `
            display: flex;
            gap: 30px;
            margin-bottom: 0px;
            border-bottom: 0px solid #BD9B46;
          `;
          
          const tabs = ['About', 'Contact', 'Cart'];
          tabs.forEach((tabName, index) => {
            const tab = document.createElement('button');
            tab.innerHTML = tabName;
            tab.className = 'modal-tab';
            tab.style.cssText = `
              background: none;
              border: none;
              padding: 0px 0;
              font-size: 18pt;
              cursor: pointer;
              border-bottom: 3px solid transparent;
              color: #BD9B46;
              transition: all 0.1s;
            `;
            tab.onclick = () => showTab(tabName.toLowerCase());
            nav.appendChild(tab);
          });
          
          // Create content area
          const contentArea = document.createElement('div');
          contentArea.id = 'modal-content';
          contentArea.style.cssText = `
            min-height: 200px;
            line-height: 1.6;
          `;
          
          // Assemble modal
          content.appendChild(closeBtn);
          content.appendChild(nav);
          content.appendChild(contentArea);
          modal.appendChild(content);
          document.body.appendChild(modal);
          
          // Show About tab by default
          showTab('about');
        }

        function showModal() {
          const modal = document.getElementById('star-modal');
          if (modal) {
            modal.style.display = 'flex';
          }
        }

        function hideModal() {
          const modal = document.getElementById('star-modal');
          if (modal) {
            modal.style.display = 'none';
          }
        }

        function showTab(tabName) {
          // Update tab appearance
          const tabs = document.querySelectorAll('.modal-tab');
          tabs.forEach(tab => {
            if (tab.innerHTML.toLowerCase() === tabName) {
              tab.style.color = '#BD9B46';
              tab.style.borderBottomColor = '#BD9B46';
            } else {
              tab.style.color = '#666';
              tab.style.borderBottomColor = 'transparent';
            }
          });
          
          // Update content
          const contentArea = document.getElementById('modal-content');
          if (contentArea) {
            switch(tabName) {
              case 'about':
                contentArea.innerHTML = `
                  <p>Welcome to Malena Foyo's fashion atelier in CDMX. Our designs blend contemporary aesthetics with traditional craftsmanship, creating pieces that speak to the modern woman's desire for both elegance and comfort.</p>
                  <p>Each garment is carefully constructed with attention to detail, using quality materials and innovative techniques. Our TUBE DRESS collection represents the intersection of minimalist design and luxurious materials.</p>
                  <p>Made locally in Mexico City, our pieces reflect the vibrant culture and artistic heritage of our beautiful city.</p>
                `;
                break;
              case 'contact':
                contentArea.innerHTML = `
                  <p>Email: hello@malenafoyo.com</p>
                  <p>Studio: CDMX, Mexico</p>
                  <p>For custom orders and inquiries, please reach out via email.</p>
                  <p>Follow us on social media for the latest collections and behind-the-scenes content.</p>
                `;
                break;
              case 'cart':
                contentArea.innerHTML = `
                  <p>Your cart is currently empty.</p>
                  <p>Browse our TUBE DRESS collection and other exclusive pieces. Each item is made to order with care and precision.</p>
                  <div style="background: #f9f9f9; border-radius: 5px; padding: 15px; margin: 20px 0;">
                    <p style="margin: 0; color: #666; font-style: italic;">Items you add will appear here with sizing options and pricing details.</p>
                  </div>
                `;
                break;
            }
          }
        }

        // Handle window resize
        function windowResized() {
          resizeCanvas(windowWidth, windowHeight);
          
          // Update nav height
          const navElement = document.getElementById('nav');
          navHeight = navElement ? navElement.offsetHeight : 50;
          
          // Keep stars within bounds
          for (const star of stars) {
            if (star.position.x > width) star.position.x = width - star.size/2;
            if (star.position.y > height) star.position.y = height - star.size/2;
            if (star.position.y < navHeight) star.position.y = navHeight + star.size/2;
          }
        }
    </script>

    <script src="scriptGTD.js" defer></script>
</body>
</html>
