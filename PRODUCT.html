    /* ================= p5 stars (hover, bounce, click-to-modal) ================= */
    const stars = [];
    const kRestitution = 0.98;
    let navHeight = 0;

   function showImage(i) {
      if (!gallery.length) return;
      
      const newIndex = (i + gallery.length) % gallery.length;
      const direction = newIndex > galleryIndex ? 1 : -1; // 1 = right, -1 = left
      const oldIndex = galleryIndex;
      galleryIndex = newIndex;
      
      const img = gallery[galleryIndex];
      const el = document.getElementById('pdp-image');
      
      // Only animate if we're actually changing images
      if (oldIndex !== galleryIndex) {
        // Slide out current image
        el.style.transition = 'transform 0.4s ease-in-out, opacity 0.4s ease-in-out';
        el.style.transform = `translateX(${direction * -100}%)`;
        el.style.opacity = '0';
        
        // After slide out, swap image and slide in
        setTimeout(() => {
          el.src = img.url;
          el.alt = img.alt || '';
          el.style.transition = 'none';
          el.style.transform = `translateX(${direction * 100}%)`;
          
          // Force reflow to ensure the transform applies before animating back
          el.offsetHeight;
          
          el.style.transition = 'transform 0.4s ease-in-out, opacity 0.4s ease-in-out';
          el.style.transform = 'translateX(0)';
          el.style.opacity = '1';
        }, 400);
      } else {
        el.src = img.url;
        el.alt = img.alt || '';
      }
    }
    
    function setup() {
      const navElement = document.getElementById('nav');
      navHeight = navElement ? navElement.offsetHeight : 50;
      createCanvas(windowWidth, windowHeight);

      const canvas = document.querySelector('canvas');
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.zIndex = '-1';
      canvas.style.pointerEvents = 'none';
      canvas.style.cursor = 'default';

      initStars();
      createModal(); // modal on PDP too
    }

    function initStars() {
      stars.length = 0;
      for (let i = 0; i < 3; i++) {
        const star = {
          position: { x: random(50, width - 50), y: random(navHeight + 50, height - 50) },
          velocity: { x: random(-8, 8), y: random(-8, 8) },
          size: 30, baseSize: 30, targetSize: 30,
          color: 'white', borderColor: 'rgb(231, 74, 231)',
          rotation: 0, rotationSpeed: random(-0.1, 0.1),
          isHovered: false,
          frozenVelocity: { x: 0, y: 0 }
        };
        if (abs(star.velocity.x) < 2) star.velocity.x = star.velocity.x > 0 ? 2 : -2;
        if (abs(star.velocity.y) < 2) star.velocity.y = star.velocity.y > 0 ? 2 : -2;
        stars.push(star);
      }
    }

    function draw() {
      clear();
      const navElement = document.getElementById('nav');
      navHeight = navElement ? navElement.offsetHeight : 50;

      checkHover(); // pause + grow on hover

      for (const star of stars) {
        updateStarSize(star);
        if (!star.isHovered) stepStar(star);
        drawStar(star);
      }
    }

    function checkHover() {
      let anyStarHovered = false;
      const mousePos = { x: mouseX, y: mouseY };

      for (const star of stars) {
        const distance = dist(mousePos.x, mousePos.y, star.position.x, star.position.y);
        const wasHovered = star.isHovered;

        star.isHovered = distance < star.size / 2;
        if (star.isHovered) anyStarHovered = true;

        if (star.isHovered && !wasHovered) {
          star.frozenVelocity.x = star.velocity.x;
          star.frozenVelocity.y = star.velocity.y;
          star.velocity.x = 0; star.velocity.y = 0;
          star.targetSize = star.baseSize * 1.3;
        }
        if (!star.isHovered && wasHovered) {
          star.velocity.x = star.frozenVelocity.x;
          star.velocity.y = star.frozenVelocity.y;
          star.targetSize = star.baseSize;
        }
      }
      document.body.style.cursor = anyStarHovered ? 'pointer' : 'default';
    }

    function updateStarSize(star) { star.size += (star.targetSize - star.size) * 0.15; }

    function stepStar(star){
      star.position.x += star.velocity.x;
      star.position.y += star.velocity.y;
      star.rotation += star.rotationSpeed;

      const radius = star.size / 2;

      // walls + nav bar
      if (star.position.x - radius < 0){
        star.velocity.x = Math.abs(star.velocity.x) * kRestitution;
        star.position.x = radius;
      }
      if (star.position.x + radius > width){
        star.velocity.x = -Math.abs(star.velocity.x) * kRestitution;
        star.position.x = width - radius;
      }
      if (star.position.y - radius < navHeight){
        star.velocity.y = Math.abs(star.velocity.y) * kRestitution;
        star.position.y = navHeight + radius;
      }
      if (star.position.y + radius > height){
        star.velocity.y = -Math.abs(star.velocity.y) * kRestitution;
        star.position.y = height - radius;
      }

      // bounce off PDP blocks (anything with .photodiv)
      checkPhotoCollisions(star, radius);
    }

    function checkPhotoCollisions(star, radius){
      const blocks = document.querySelectorAll('.photodiv');
      blocks.forEach(el => {
        const r = el.getBoundingClientRect();
        const left=r.left, right=r.right, top=r.top, bottom=r.bottom;

        const starLeft   = star.position.x - radius;
        const starRight  = star.position.x + radius;
        const starTop    = star.position.y - radius;
        const starBottom = star.position.y + radius;

        const overlap = starRight > left && starLeft < right && starBottom > top && starTop < bottom;
        if (!overlap) return;

        const overlapLeft   = starRight - left;
        const overlapRight  = right - starLeft;
        const overlapTop    = starBottom - top;
        const overlapBottom = bottom - starTop;
        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

        if (minOverlap === overlapLeft){
          star.velocity.x = -Math.abs(star.velocity.x) * kRestitution;
          star.position.x = left - radius;
        } else if (minOverlap === overlapRight){
          star.velocity.x =  Math.abs(star.velocity.x) * kRestitution;
          star.position.x = right + radius;
        } else if (minOverlap === overlapTop){
          star.velocity.y = -Math.abs(star.velocity.y) * kRestitution;
          star.position.y = top - radius;
        } else if (minOverlap === overlapBottom){
          star.velocity.y =  Math.abs(star.velocity.y) * kRestitution;
          star.position.y = bottom + radius;
        }
      });
    }

    function drawStar(star) {
      push();
      translate(star.position.x, star.position.y);
      rotate(star.rotation);

      const outerRadius = star.size / 2;
      const innerRadius = outerRadius * 0.4;

      fill(star.borderColor); noStroke();
      drawRoundedStar(outerRadius + 6, innerRadius + 5);

      fill(star.color); noStroke();
      drawRoundedStar(outerRadius, innerRadius);

      pop();
    }

    function drawRoundedStar(outerRadius, innerRadius) {
      const points = [];
      for (let i = 0; i < 10; i++) {
        const angle = (i * PI) / 5;
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        points.push({ x: cos(angle) * radius, y: sin(angle) * radius });
      }
      beginShape();
      for (let i = 0; i < points.length; i++) {
        const current = points[i];
        const next = points[(i + 1) % points.length];
        const prev = points[(i - 1 + points.length) % points.length];

        if (i % 2 === 0) {
          const toPrev = createVector(prev.x - current.x, prev.y - current.y);
          const toNext = createVector(next.x - current.x, next.y - current.y);
          toPrev.normalize().mult(3); toNext.normalize().mult(3);
          const cp1 = { x: current.x + toPrev.x, y: current.y + toPrev.y };
          const cp2 = { x: current.x + toNext.x, y: current.y + toNext.y };
          if (i === 0) vertex(cp1.x, cp1.y);
          quadraticVertex(current.x, current.y, cp2.x, cp2.y);
        } else {
          vertex(current.x, current.y);
        }
      }
      endShape(CLOSE);
    }

    /* click opens modal */

    const SF_ENDPOINT = `https://${SHOPIFY_DOMAIN}/api/${SHOPIFY_API_VERSION}/graphql.json`;

    async function sf(query, variables = {}) {
      const r = await fetch(SF_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Shopify-Storefront-Access-Token': SHOPIFY_STOREFRONT_TOKEN
        },
        body: JSON.stringify({ query, variables })
      });
      const txt = await r.text();
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${txt}`);
      const j = JSON.parse(txt);
      if (j.errors) throw new Error('GraphQL: ' + JSON.stringify(j.errors));
      return j.data;
    }

function getVariantForSelection() {
  if (!product || !product.variants?.edges?.length) return null;

  const wanted = Object.entries(selected); // e.g., [['Color','Gold'],['Size','M']]
  // exact match on all selected options
  for (const e of product.variants.edges) {
    const v = e.node;
    const opts = v.selectedOptions || [];
    const match = wanted.every(([n, val]) =>
      opts.some(o => o.name.toLowerCase() === n.toLowerCase() && o.value === val)
    );
    if (match) return v;
  }
  return null;
}

function findSelectedVariantId() {
  const v = getVariantForSelection();
  if (v) return v.id;
  // fallback: first available
  const avail = product?.variants?.edges?.find(e => e.node.availableForSale);
  return avail?.node?.id || product?.variants?.edges?.[0]?.node?.id || null;
}

function updateAvailabilityUI() {
  const addBtn = document.getElementById('addToCart');
  const checkoutBtn = document.getElementById('checkout');

  const v = getVariantForSelection();

  // Default: enabled
  const enable = v && v.availableForSale === true;

if (enable) {
  addBtn.innerHTML = 'CART <span class="cart-plus">+</span>';
  addBtn.disabled = false;
  addBtn.style.cursor = 'pointer';
  addBtn.style.opacity = '1';
  addBtn.style.backgroundColor = 'white';
  addBtn.style.color = '#BD9B46';

  // show checkout
  checkoutBtn.style.display = '';
  checkoutBtn.disabled = false;
  checkoutBtn.style.cursor = 'pointer';
  checkoutBtn.style.opacity = '1';
  checkoutBtn.style.backgroundColor = 'white';
  checkoutBtn.style.color = '#BD9B46';
} else {
  addBtn.textContent = 'SOLD OUT';
  addBtn.disabled = true;
  addBtn.style.cursor = 'not-allowed';
  addBtn.style.opacity = '1';
  addBtn.style.backgroundColor = '#ddd';
  addBtn.style.color = '#999';

  // hide checkout for an unavailable size
  checkoutBtn.style.display = 'none';
}

}



    async function ensureCart() {
      if (cartId) return cartId;
      const d = await sf(CART_CREATE, { lines: [] });
      cartId = d.cartCreate.cart.id;
      localStorage.setItem('cartId', cartId);
      return cartId;
    }

    async function addSelectionToCart() {
      const variantId = findSelectedVariantId();
      if (!variantId) { alert('This variant is unavailable.'); return null; }
      const id = await ensureCart();
      const d = await sf(CART_LINES_ADD, {
        cartId: id,
        lines: [{ merchandiseId: variantId, quantity: 1 }]
      });
      return d.cartLinesAdd.cart.checkoutUrl;
    }

    async function getCart() {
  if (!cartId) return null;
  const data = await sf(CART_QUERY, { id: cartId });
  return data?.cart || null;
}

function formatMoney(amount, currency) {
  if (amount == null) return '';
  const n = Math.round(Number(amount));
  return `$${n}${currency || 'MXN'}`;
}

async function removeCartLine(lineId) {
  if (!cartId) return;
  try {
    await sf(CART_LINES_REMOVE, { cartId, lineIds: [lineId] });
    renderCartIntoModal(); // refresh the modal
  } catch (err) {
    console.error("Error removing line:", err);
  }
}

/* Renders the cart inside your existing modal “Cart” tab */
async function renderCartIntoModal() {
  const cart = await getCart();
  const area = document.getElementById('modal-content');
  if (!area) return;

  if (!cart || cart.totalQuantity === 0) {
    area.innerHTML = `<p>Your cart is currently empty.</p>`;
    return;
  }

  const lines = cart.lines?.edges || [];
  const itemsHTML = lines.map(e => {
    const ln = e.node;
    const m  = ln.merchandise;
    return `
      <div class="cart-line" data-lineid="${ln.id}">
        <img src="${m.image?.url || ''}" alt="${m.image?.altText || ''}">
        <div class="cart-line-info">
          <div class="cart-title">${m.product?.title || ''}</div>
          <div class="cart-variant">${m.title || ''}</div>
          <div class="cart-qty-price">Qty: ${ln.quantity} · ${formatMoney(m.price?.amount, m.price?.currencyCode)}</div>
        </div>
        <button class="cart-remove" data-lineid="${ln.id}">×</button>
      </div>
    `;
  }).join('');

  area.innerHTML = `
    <div class="cart-lines">${itemsHTML}</div>
    <div class="cart-summary">
      <div>Subtotal: <strong>${formatMoney(cart.cost?.subtotalAmount?.amount, cart.cost?.subtotalAmount?.currencyCode)}</strong></div>
      <a class="cart-checkout-btn" href="${cart.checkoutUrl}">Go to Checkout</a>
    </div>
  `;

  // wire up remove buttons *after* we render the HTML
  area.querySelectorAll('.cart-remove').forEach(btn => {
    btn.addEventListener('click', () => removeCartLine(btn.dataset.lineid));
  });
}


function openCartModal() {
  showModal();
  showTab('cart');
  renderCartIntoModal();
}


    async function initPDP() {
      try {
        const handle = getParam('handle');
        if (!handle) { alert('Missing ?handle='); location.href = 'index.html'; return; }

        const data = await sf(PRODUCT_BY_HANDLE, { handle });
        if (!data?.product) { alert('Product not found'); location.href = 'index.html'; return; }
        product = data.product;

        renderPDP();

        // Gallery controls
        document.getElementById('imgPrev').onclick = () => showImage(galleryIndex - 1);
        document.getElementById('imgNext').onclick = () => showImage(galleryIndex + 1);
        // keyboard support
        window.addEventListener('keydown', (e)=>{
          if (gallery.length < 2) return;
          if (e.key === 'ArrowLeft')  showImage(galleryIndex - 1);
          if (e.key === 'ArrowRight') showImage(galleryIndex + 1);
        });

        // Buttons
document.getElementById('addToCart').onclick = async () => {
  const url = await addSelectionToCart();

  // Animate button
  const btn = document.getElementById('addToCart');
  btn.textContent = 'ADDED ✓';
  setTimeout(() => (btn.innerHTML = 'CART <span class="cart-plus">+</span>'), 800);

  // Immediately show updated cart modal
  openCartModal();
    // if Cart tab is visible right now, refresh it
  const cartTabActive = [...document.querySelectorAll('.modal-tab')].some(t =>

  );
  if (cartTabActive) renderCartIntoModal();
};

        document.getElementById('checkout').onclick = async () => {

        console.error(err);
        alert('There was a problem loading this product.');

    document.addEventListener('DOMContentLoaded', initPDP);

document.querySelectorAll('.img-nav').forEach(btn => {
